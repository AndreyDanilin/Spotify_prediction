services:
  app:
    build:
      context: ..
      dockerfile: music-classifier/Dockerfile
      args:
        INSTALL_EXTRAS: api
    container_name: music-classifier
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  trainer:
    profiles: ["train"]
    build:
      context: ..
      dockerfile: music-classifier/Dockerfile
      args:
        INSTALL_EXTRAS: train
    command: ["spotify-train", "--data-dir", "data", "--output", "music-classifier/app/model.joblib"]
    volumes:
      - ./app:/app/music-classifier/app
