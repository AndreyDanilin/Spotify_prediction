[project]
name = "spotify-prediction"
version = "0.2.0"
description = "Spotify hit prediction research, training pipeline, and Litestar API."
readme = "Readme.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "litestar==2.21.1",
    "numpy==2.3.5",
    "polars==1.39.3",
    "pydantic==2.13.1",
]

[project.optional-dependencies]
api = [
    "catboost==1.2.10",
    "joblib==1.5.2",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "python-dotenv==1.2.1",
    "scikit-learn==1.8.0",
    "sentence-transformers==5.4.1",
    "uvicorn==0.38.0",
    "xgboost==3.2.0",
]
train = [
    "catboost==1.2.10",
    "joblib==1.5.2",
    "matplotlib==3.10.7",
    "optuna==4.8.0",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "scikit-learn==1.8.0",
    "seaborn==0.13.2",
    "sentence-transformers==5.4.1",
    "xgboost==3.2.0",
]
dev = [
    "httpx==0.28.1",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "pytest==9.0.2",
    "scikit-learn==1.8.0",
]
notebook = [
    "ipykernel==7.1.0",
    "nbclient==0.10.2",
]

[project.scripts]
spotify-train = "spotify_prediction.training:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
